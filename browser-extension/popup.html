<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; font-family: system-ui, sans-serif; font-size: 13px; margin: 0; padding: 14px;
         background: linear-gradient(135deg, #0a195a, #5f2daa 55%, #0a828c); color: #fff; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: flex; align-items: center; gap: 8px; margin: 8px 0; cursor: pointer; }
  #status { margin-top: 10px; padding: 8px; border-radius: 8px; background: rgba(255,255,255,.12); }
  #status.ok { background: rgba(60,220,150,.25); }
  #status.bad { background: rgba(255,120,120,.25); }
  button { margin-top: 10px; padding: 7px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.4);
           background: rgba(255,255,255,.15); color: #fff; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.28); }
  a { color: #cfe3ff; }
  .hint { font-size: 11px; opacity: .85; margin-top: 8px; }
</style>
</head>
<body>
  <h1>TNxIDM Integration</h1>
  <label><input type="checkbox" id="enabled"> Take over browser downloads</label>
  <label><input type="checkbox" id="interceptAll"> Intercept all file types</label>
  <button id="test">Test connection</button>
  <div id="status">Not tested yet.</div>
  <div class="hint">TNxIDM must be running (tray is fine). Manage file types in <a href="#" id="opts">Options</a>.</div>
  <script src="popup.js"></script>
</body>
</html>
