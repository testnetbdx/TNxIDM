<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>TNxIDM Integration - Options</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px;
         background: linear-gradient(135deg, #0a195a, #5f2daa 55%, #0a828c); color: #fff; min-height: 100vh; }
  h1 { font-size: 18px; }
  textarea { width: 100%; height: 110px; border-radius: 8px; padding: 8px; font-size: 13px; }
  button { margin-top: 10px; padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,.4);
           background: rgba(255,255,255,.15); color: #fff; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.28); }
  #msg { margin-top: 10px; }
  p { font-size: 13px; opacity: .9; }
</style>
</head>
<body>
  <h1>TNxIDM Integration - Options</h1>
  <p>File extensions the extension takes over (space separated). Used only when
     "Intercept all file types" is off in the popup.</p>
  <textarea id="exts"></textarea><br>
  <button id="save">Save</button>
  <div id="msg"></div>
  <script src="options.js"></script>
</body>
</html>
